[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "su2live"
version = "0.3.0"
description = "Live terminal residual plots for SU2 CFD runs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Suvam Samanta" }]
keywords = ["su2", "cfd", "residuals", "monitoring", "terminal"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Syphonicc/su2live"
Issues = "https://github.com/Syphonicc/su2live/issues"

[project.scripts]
su2live = "su2live.cli:main"

[tool.setuptools.packages.find]
include = ["su2live*"]
